name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ยังไม่ได้ตั้ง secret KEYSTORE_BASE64 จะ build เป็น debug แทน"
          fi

      - name: Build signed release APK
        if: env.KEYSTORE_FILE != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build debug APK (no keystore)
        if: env.KEYSTORE_FILE == ''
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: WorkCheckIn-apk
          path: app/build/outputs/apk/*/*.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSION"
          # ออก Release ใหม่เมื่อเลขเวอร์ชันเปลี่ยน ถ้ามีอยู่แล้วให้อัปเดตไฟล์ APK
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/release/*.apk --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/release/*.apk \
              --target "$GITHUB_SHA" \
              --title "เช็คอินงาน $TAG" \
              --notes "APK พร้อมติดตั้ง (signed release) · By NorthxBar"
          fi
